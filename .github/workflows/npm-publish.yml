on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: number
      release-tag:
        required: false
        type: string

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ngx-darkbox-gallery
          path: artifact/ngx-darkbox-gallery/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - run: npm i
      - run: npm publish --access public ${{ inputs.release-tag }}
        working-directory: artifact/ngx-darkbox-gallery
